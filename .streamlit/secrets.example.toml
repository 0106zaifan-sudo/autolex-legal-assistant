# 仅示例：复制到本地 .streamlit/secrets.toml，或填入部署平台的 Secrets。
# 不要提交真实 secrets.toml。默认 public，未设置密码哈希将锁定应用。
APP_MODE = "public"
APP_PASSWORD_HASH = "" # 用 python tools/hash_password.py 生成
OPENAI_API_KEY = "" # 空值时禁用 AI；不读取环境变量作为回退
OPENAI_MODEL = "gpt-4.1-mini"
AI_SINGLE_INSTANCE = true # 仅限单实例；多实例必须使用外部统一鉴权和调用限流
AI_LIMIT_DB = ".autolex_runtime/limits.sqlite3" # 应放在可写且持久的单实例磁盘
AI_DAILY_LIMIT = 20 # 全应用，北京时间自然日；失败请求也计入
AI_HOURLY_LIMIT = 5 # 同一访问密码的所有会话共享，滚动1小时
AI_COOLDOWN_SECONDS = 30
