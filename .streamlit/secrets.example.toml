# 仅示例：复制到本地 .streamlit/secrets.toml，或填入部署平台的 Secrets。
# 不要提交真实 secrets.toml。默认 public，未设置密码哈希将锁定应用。
APP_MODE = "public"
APP_PASSWORD_HASH = "" # 用 python tools/hash_password.py 生成
AI_PROVIDER = "deepseek" # openai 或 deepseek；旧配置缺省仍为 openai
DEEPSEEK_API_KEY = "" # 仅供DeepSeek；Codespaces可使用同名安全Secret，无需在文件填入
DEEPSEEK_MODEL = "deepseek-flash"
OPENAI_API_KEY = "" # 仅供OpenAI；所选服务商无密钥时禁用AI，不跨服务商回退
OPENAI_MODEL = "gpt-4.1-mini"
AI_SINGLE_INSTANCE = true # 仅限单实例；多实例必须使用外部统一鉴权和调用限流
AI_LIMIT_DB = ".autolex_runtime/limits.sqlite3" # 应放在可写且持久的单实例磁盘
AI_DAILY_LIMIT = 20 # 全应用，北京时间自然日；失败请求也计入
AI_HOURLY_LIMIT = 5 # 同一访问密码的所有会话共享，滚动1小时
AI_COOLDOWN_SECONDS = 30
AI_DAILY_INPUT_CHARS = 100000 # 源文本累计字符预留，失败不返还
AI_HOURLY_INPUT_CHARS = 50000
AI_MAX_REQUEST_BYTES = 128000 # 完整请求UTF8编码预算（含Schema/提示及余量），不是token用量
AI_DAILY_REQUEST_BYTES = 512000
AI_HOURLY_REQUEST_BYTES = 256000
AI_TOTAL_TIMEOUT_SECONDS = 45 # 默认真实调用使用可终止子进程，总截止时间，最大90秒
